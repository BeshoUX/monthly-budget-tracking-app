<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Budget Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>💰 Monthly Budget Tracker</h1>

        <!-- Summary Cards -->
        <div class="summary">
            <div class="card income">
                <h3>Total Income</h3>
                <p id="totalIncome">$0.00</p>
            </div>
            <div class="card expense">
                <h3>Total Expenses</h3>
                <p id="totalExpenses">$0.00</p>
            </div>
            <div class="card balance">
                <h3>Balance</h3>
                <p id="balance">$0.00</p>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-section">
            <h3>Budget Progress</h3>
            <p id="progressText">Add income to see budget progress</p>
        </div>

        <!-- Add Transaction Form -->
        <div class="form-card">
            <h2>Add Transaction</h2>
            <form id="transactionForm">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" required placeholder="e.g., Grocery shopping">
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" min="0.01" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select category</option>
                        <option value="food">🍔 Food & Dining</option>
                        <option value="rent">🏠 Rent / Housing</option>
                        <option value="utilities">💡 Utilities</option>
                        <option value="transport">🚗 Transport</option>
                        <option value="entertainment">🎬 Entertainment</option>
                        <option value="shopping">🛍️ Shopping</option>
                        <option value="health">🏥 Health</option>
                        <option value="salary">💰 Salary</option>
                        <option value="freelance">💼 Freelance</option>
                        <option value="other">📦 Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <button type="submit">Add Transaction</button>
            </form>
        </div>

        <!-- Transactions List -->
        <div class="transactions-card">
            <h2>Recent Transactions</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button id="clearAll" style="background: #ef4444;">Clear All Transactions</button>
                <button id="exportBtn" style="background: #10b981;">📥 Export to Excel (.xlsx)</button>
            </div>
            <div id="transactionsList">
                <p class="no-transactions">No transactions yet. Add your first transaction above!</p>
            </div>
        </div>
    </div>

    <!-- SheetJS for Excel export -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
